name: Test

# The extension's tests, in a real VS Code (the Extension Development Host),
# on each of the three systems it runs on, as VS Code's guide sets it up:
# https://code.visualstudio.com/api/working-with-extensions/continuous-integration
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # A Linux runner has no display: xvfb gives VS Code one.
    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm test

    - name: Run tests
      if: runner.os != 'Linux'
      run: npm test
